# No Ingress or NodePort. Create a private bucket and restricted application
# credentials separately; do not use the root credentials in the backend.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orchard-mall-minio-data
  namespace: {{ target_namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ storage_class }}
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchard-mall-minio
  namespace: {{ target_namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchard-mall-minio
  template:
    metadata:
      labels:
        app: orchard-mall-minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args:
            - server
            - /data
            - --console-address
            - :9001
          envFrom:
            - secretRef:
                name: orchard-mall-minio-secret
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orchard-mall-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: orchard-mall-minio
  namespace: {{ target_namespace }}
spec:
  type: ClusterIP
  selector:
    app: orchard-mall-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
