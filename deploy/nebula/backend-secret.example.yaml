# Key names only; create the actual Nebula project Secret in its secret UI/API.
# Never apply this example as runtime credentials or commit secret values.
apiVersion: v1
kind: Secret
metadata:
  name: orchard-mall-backend-secret
  namespace: orchard-mall-test
type: Opaque
stringData:
  DB_USER: REPLACE_IN_NEBULA_SECRET
  DB_PASSWORD: REPLACE_IN_NEBULA_SECRET
  MINIO_ACCESS_KEY: REPLACE_IN_NEBULA_SECRET
  MINIO_SECRET_KEY: REPLACE_IN_NEBULA_SECRET
  ADMIN_INIT_PASSWORD: REPLACE_IN_NEBULA_SECRET
