name: ${COMPOSE_PROJECT_NAME:-orchard-mall-local}
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:${MYSQL_PORT:-3306}:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports: ["127.0.0.1:${MINIO_API_PORT:-9000}:9000","127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
  backend:
    profiles: ["full"]
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      ADMIN_ORIGIN: http://localhost:8088
      DEV_CONSUMER_LOGIN_ENABLED: ${DEV_CONSUMER_LOGIN_ENABLED:-false}
      DEV_PAYMENT_ENABLED: ${DEV_PAYMENT_ENABLED:-false}
      DEV_REFUND_ENABLED: ${DEV_REFUND_ENABLED:-false}
      PAYMENT_MERCHANT_SUBJECT: ${PAYMENT_MERCHANT_SUBJECT:-orchard-mall-local}
    depends_on:
      mysql: { condition: service_healthy }
      minio: { condition: service_healthy }
  nginx:
    profiles: ["full"]
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${NGINX_PORT:-8088}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../admin-web/dist:/usr/share/nginx/html:ro
    depends_on: [backend]
volumes:
  mysql_data:
  redis_data:
  minio_data:
